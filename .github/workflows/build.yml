name: Compila APK

# Si avvia a ogni caricamento sul ramo principale, e si puo' anche
# lanciare a mano dalla linguetta Actions.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Prendi il codice
        uses: actions/checkout@v4

      - name: Prepara Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Il progetto non ha il wrapper di Gradle: lo installa l'azione,
      # bloccato a una versione precisa.
      - name: Prepara Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Gli errori del compilatore diventano "annotazioni" della build:
      # si leggono dalla pagina della build e dalle API di GitHub, senza
      # dover scaricare il registro completo.
      - name: Compila l'APK
        run: |
          set -o pipefail
          if ! gradle assembleDebug --stacktrace 2>&1 | tee /tmp/build.log; then
            grep -E "^e: " /tmp/build.log | head -40 | while IFS= read -r riga; do
              echo "::error title=Compilazione::${riga}"
            done
            grep -A 8 "What went wrong" /tmp/build.log | head -20 | tr '\n' ' ' | sed 's/^/::error title=Gradle::/'
            echo
            exit 1
          fi

      # Controllo: le librerie del motore (con tutte le varianti per i vari
      # processori) devono essere dentro l'APK. Se ne manca una la build
      # si ferma qui, invece di scoprirlo sul telefono.
      - name: Controlla le librerie del motore
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          LIBS=$(unzip -l "$APK" | grep -o 'lib/arm64-v8a/[^ ]*\.so' | sort)
          echo "$LIBS"
          echo "::notice title=Librerie nell'APK::$(echo $LIBS | tr '\n' ' ')"
          for l in libdiario_llm.so libllama.so libggml.so libggml-base.so libc++_shared.so libggml-cpu-android_armv8.0_1.so; do
            echo "$LIBS" | grep -q "/$l" || { echo "::error title=Libreria mancante::$l"; exit 1; }
          done

      # L'APK si carica subito, prima dei test: se un test dovesse
      # fallire, l'APK e' comunque gia' scaricabile.
      - name: Metti l'APK fra i risultati
        uses: actions/upload-artifact@v4
        with:
          name: DiarioLavorativo-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Esegui i test
        run: |
          set -o pipefail
          if ! gradle testDebugUnitTest --stacktrace 2>&1 | tee /tmp/test.log; then
            python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          n = 0
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for fail in list(tc.findall('failure')) + list(tc.findall('error')):
                      msg = (fail.get('message') or fail.text or '').strip().splitlines()
                      msg = msg[0] if msg else ''
                      print(f"::error title=Test {tc.get('classname','').split('.')[-1]}::{tc.get('name')}: {msg[:400]}")
                      n += 1
          if n == 0:
              print("::error title=Test::nessun dettaglio nei risultati, vedi il registro")
          PY
            grep -E "^e: " /tmp/test.log | head -20 | while IFS= read -r riga; do
              echo "::error title=Compilazione test::${riga}"
            done
            exit 1
          fi

      - name: Metti i referti dei test fra i risultati
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: referti-test
          path: app/build/reports/tests/
          if-no-files-found: ignore
